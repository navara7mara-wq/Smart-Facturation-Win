<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table Facturation - SAPTA Facturation</title>
  <link rel="stylesheet" href="/static/sapta-new.css">
</head>
<body class="sapta-app">
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-dashboard" viewBox="0 0 24 24"><path d="M4 13a8 8 0 1 1 16 0"/><path d="M12 13l3-4"/><path d="M5 18h14"/><path d="M8 18v-2m8 2v-2"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 12h6M9 16h6"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V2h6v2M9 9h6M9 13h6M9 17h4"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><path d="M12 12v9M8 21h8M9 12l3-9 3 9"/><path d="M6.5 5.5a8 8 0 0 0 0 11M17.5 5.5a8 8 0 0 1 0 11M4 3a11.5 11.5 0 0 0 0 18M20 3a11.5 11.5 0 0 1 0 18"/></symbol>
    <symbol id="i-calculator" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8v4H8zM8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 22V5l8-3v20M12 8h8v14M8 7h.01M8 11h.01M8 15h.01M8 19h.01M16 12h.01M16 16h.01M16 20h.01M2 22h20"/></symbol>
    <symbol id="i-template" viewBox="0 0 24 24"><path d="M4 3h16v18H4zM4 8h16M9 8v13"/><path d="M12 12h5M12 16h5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-filter-x" viewBox="0 0 24 24"><path d="M4 4h16l-6 7v6l-4 3v-9z"/><path d="m17 15 4 4m0-4-4 4"/></symbol>
    <symbol id="i-excel" viewBox="0 0 24 24"><path d="M13 3h7v18h-7M4 5l9-2v18l-9-2z"/><path d="m7 9 3 6M10 9l-3 6M16 8h2M16 12h2M16 16h2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10zM13.5 6.5 17 10"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  </svg>

  <aside class="sapta-sidebar" id="saptaSidebar">
    <a class="sapta-brand" href="/" aria-label="SAPTA Facturation">
      <svg class="sapta-logo" viewBox="0 0 42 44" aria-hidden="true">
        <path d="M21 1 39 11 21 21 3 11z"/><path d="M3 18 10 14l11 6 11-6 7 4-18 10z"/><path d="M3 27 10 23l11 6 11-6 7 4-18 10z"/><path d="M3 36 10 32l11 6 11-6 7 4-18 10z"/>
      </svg>
      <span><strong>SAPTA</strong><small>Facturation</small></span>
    </a>

    <nav class="sapta-nav" aria-label="Navigation principale">
      <a href="/"><svg><use href="#i-dashboard"/></svg><span>Tableau de bord</span></a>
      <a class="active" href="/table-facturation-new"><svg><use href="#i-table"/></svg><span>Table Facturation</span></a>
      <a href="/invoices"><svg><use href="#i-file"/></svg><span>Factures</span></a>
      <a href="/purchase-orders"><svg><use href="#i-clipboard"/></svg><span>Bons de commande</span></a>
      <a href="/mobilis"><svg><use href="#i-radio"/></svg><span>Mobilis</span></a>
      <a href="/bpu"><svg><use href="#i-calculator"/></svg><span>BPU</span></a>
      <a href="/company"><svg><use href="#i-building"/></svg><span>Entreprise</span></a>
      <a href="/templates"><svg><use href="#i-template"/></svg><span>Templates</span></a>
    </nav>

    <div class="sapta-user">
      <span class="sapta-avatar">{{USER_INITIALS}}</span>
      <span class="sapta-user-copy"><strong>{{USER_NAME}}</strong><small>Administrateur</small></span>
      <svg class="sapta-user-chevron"><use href="#i-chevron-down"/></svg>
    </div>
  </aside>

  <main class="sapta-main">
    <div class="sapta-page">
      <h1>Table Facturation</h1>
      {{ALERT}}

      <section class="facturation-card">
        <form class="facturation-filters" method="get" action="/table-facturation-new" autocomplete="off">
          <label class="filter-control search-control">
            <span class="filter-label sr-only">Recherche</span>
            <svg><use href="#i-search"/></svg>
            <input name="q" value="{{SEARCH}}" placeholder="Rechercher site, BC ou facture">
          </label>

          <label class="filter-control">
            <span class="filter-label">Direction</span>
            <span class="select-wrap"><select name="direction">{{DIRECTION_OPTIONS}}</select><svg><use href="#i-chevron-down"/></svg></span>
          </label>

          <label class="filter-control">
            <span class="filter-label">Type BC</span>
            <span class="select-wrap"><select name="type">{{TYPE_OPTIONS}}</select><svg><use href="#i-chevron-down"/></svg></span>
          </label>

          <label class="filter-control">
            <span class="filter-label">Région</span>
            <span class="select-wrap"><select name="region">{{REGION_OPTIONS}}</select><svg><use href="#i-chevron-down"/></svg></span>
          </label>

          <label class="filter-control">
            <span class="filter-label">État dépôt</span>
            <span class="select-wrap"><select name="depos">{{DEPOS_OPTIONS}}</select><svg><use href="#i-chevron-down"/></svg></span>
          </label>

          <div class="filter-control date-range-control">
            <span class="filter-label sr-only">Période</span>
            <svg class="date-icon"><use href="#i-calendar"/></svg>
            <input aria-label="Date de début" type="date" name="date_start" value="{{DATE_START}}">
            <span class="date-arrow">→</span>
            <input aria-label="Date de fin" type="date" name="date_end" value="{{DATE_END}}">
          </div>

          <input type="hidden" name="per_page" value="{{PER_PAGE}}">
          <button class="clear-filters" type="button" data-clear-filters title="Réinitialiser les filtres" aria-label="Réinitialiser les filtres"><svg><use href="#i-filter-x"/></svg></button>
          <button class="export-excel" type="submit" formaction="/table-facturation-new/export" title="Exporter les résultats filtrés"><svg><use href="#i-excel"/></svg><span>Exporter Excel</span></button>
        </form>

        <div class="facturation-table-wrap">
          <table class="facturation-table">
            <colgroup>
              <col class="c-site"><col class="c-bet"><col class="c-typologie"><col class="c-type"><col class="c-bc"><col class="c-facture"><col class="c-region"><col class="c-date"><col class="c-ttc"><col class="c-remarque"><col class="c-depose"><col class="c-maj"><col class="c-actions">
            </colgroup>
            <thead><tr>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="site"><span>C. SITE</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="bet"><span>BET</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="typologie"><span>TYPOLOGIE</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="type"><span>TYPE BC</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="bc"><span>N° BON DE COMMANDE</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="invoice"><span>N° FACTURE</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="region"><span>RÉGION</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="date"><span>DATE FACTURE</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="ttc"><span>TTC</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th><span>REMARQUE</span></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="depos"><span>DÉPOSÉ</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th class="sortable-header"><button type="button" class="table-sort-button" data-sort-key="maj"><span>MAJ</span><span class="table-sort-arrow" aria-hidden="true"></span></button></th>
              <th><span>ACTIONS</span></th>
            </tr></thead>
            <tbody>{{ROWS}}</tbody>
          </table>
        </div>

        <footer class="facturation-footer">
          <p>{{SUMMARY}}</p>
          <div class="facturation-pagination">
            <label class="per-page-select"><select data-per-page>{{PER_PAGE_OPTIONS}}</select><svg><use href="#i-chevron-down"/></svg></label>
            {{PAGINATION}}
          </div>
        </footer>
      </section>
    </div>
  </main>

  <div class="sapta-toast" role="status" aria-live="polite" data-toast></div>
  <script src="/static/table-facturation-new.js"></script>
</body>
</html>
